<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Hari Mandir | Divine Essentials</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- 1. CORE VARIABLES --- */
        :root {
            --primary: #d35400; 
            --gold: #FFD700;
            --cream: #FFFBF2;
            --dark: #0f0800;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--cream);
            color: #333;
            overflow-x: hidden;
            background-image: radial-gradient(var(--gold) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
        }

        /* --- 2. UPDATED PRELOADER --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000; /* Extremely high z-index */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: visibility 0.8s, opacity 0.8s;
        }

        .curtain {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            background: #1a0f05;
            z-index: 1;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .curtain-left { left: 0; border-right: 1px solid rgba(255,215,0,0.1); }
        .curtain-right { right: 0; border-left: 1px solid rgba(255,215,0,0.1); }

        .loader-content {
            position: relative;
            z-index: 2;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .chakra-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun-rays {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent 0%, rgba(255,215,0,0.4) 20%, transparent 40%);
            animation: spin 6s linear infinite;
            border-radius: 50%;
        }

        .loader-logo {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            border: 2px solid var(--gold);
            padding: 5px;
            background: #0f0800;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
            object-fit: cover;
        }

        /* Loaded States */
        body.loaded #preloader {
            opacity: 0;
            visibility: hidden;
        }
        body.loaded .curtain-left { transform: translateX(-100%); }
        body.loaded .curtain-right { transform: translateX(100%); }
        body.loaded .loader-content { opacity: 0; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- 3. HEADER & MOBILE MENU --- */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            padding: 15px 0; transition: all 0.4s ease;
        }
        header.scrolled {
            background: rgba(15, 8, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo-img { height: 50px; border-radius: 4px; }

        .desktop-nav { display: flex; gap: 30px; }
        .desktop-nav a {
            color: white; text-decoration: none; font-weight: 700;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
            transition: color 0.3s;
        }
        .desktop-nav a:hover { color: var(--gold); }

        .mobile-menu-btn {
            display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1001;
        }
        .mobile-menu-btn span {
            display: block; width: 28px; height: 3px; background: white; border-radius: 2px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mobile-menu-btn.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .mobile-menu-btn.open span:nth-child(2) { opacity: 0; }
        .mobile-menu-btn.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        .mobile-overlay {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
            background: rgba(15, 8, 0, 0.98); backdrop-filter: blur(15px);
            z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .mobile-overlay.active { right: 0; }
        .mobile-overlay a {
            color: white; text-decoration: none; font-size: 2rem;
            font-family: 'Cinzel', serif; margin: 15px 0;
            transform: translateX(50px); opacity: 0; transition: 0.4s;
        }
        .mobile-overlay.active a { transform: translateX(0); opacity: 1; }

        /* --- 4. HERO SECTION --- */
        .hero {
            height: 100vh; position: relative;
            display: flex; align-items: center; justify-content: center;
            text-align: center; color: white; overflow: hidden;
        }
        .hero-bg { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1606293926075-69a00dbfde81?auto=format&fit=crop&w=1200&q=80') center/cover; z-index: -2; animation: zoom 20s infinite alternate linear; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(15,8,0,0.9)); z-index: -1; }
        .hero h1 { font-family: 'Cinzel', serif; font-size: clamp(2.5rem, 8vw, 5rem); margin-bottom: 10px; }
        
        /* --- 5. PRODUCTS --- */
        .products { padding: 80px 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-family: 'Cinzel', serif; font-size: 2.5rem; color: var(--primary); margin-bottom: 40px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: white; border-radius: 20px; padding: 25px; text-align: center; box-shadow: var(--shadow); transition: 0.3s; }
        .product-card:hover { transform: translateY(-10px); }
        .img-box { height: 200px; margin-bottom: 15px; }
        .img-box img { max-height: 100%; object-fit: contain; }
        .price { display: block; color: var(--primary); font-weight: 900; font-size: 1.4rem; margin: 10px 0; }
        .order-btn { background: #25D366; color: white; text-decoration: none; padding: 12px 25px; border-radius: 30px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }

        @media (max-width: 768px) {
            .desktop-nav { display: none; }
            .mobile-menu-btn { display: flex; }
            .product-grid { grid-template-columns: 1fr; }
        }

        @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="loader-content">
            <div class="chakra-container">
                <div class="sun-rays"></div>
                <img src="logo.jpeg" alt="Logo" class="loader-logo" onerror="this.src='https://via.placeholder.com/100?text=Logo'">
            </div>
            <h2 style="color:white; font-family:'Cinzel'; letter-spacing: 2px; font-size: 1.2rem;">SHRI HARI MANDIR</h2>
            <p style="color: var(--gold); font-size: 0.8rem; margin-top: 5px;">DIVINE ESSENTIALS</p>
        </div>
    </div>

    <!-- HEADER -->
    <header id="main-header">
        <div class="header-container">
            <img src="logo.jpeg" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/50?text=Logo'">
            
            <nav class="desktop-nav">
                <a href="#home">Home</a>
                <a href="#products">Collection</a>
                <a href="#contact">Contact</a>
            </nav>

            <div class="mobile-menu-btn" id="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- MOBILE OVERLAY -->
    <div class="mobile-overlay" id="mobile-menu">
        <a href="#home">Home</a>
        <a href="#products">Collection</a>
        <a href="#contact">Contact</a>
    </div>

    <!-- HERO -->
    <section id="home" class="hero">
        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Shri Hari Mandir</h1>
            <p style="color: var(--gold); letter-spacing: 4px; text-transform: uppercase;">A Brand by Yukta Marketing</p>
        </div>
    </section>

    <!-- PRODUCTS -->
    <section id="products" class="products">
        <h2 class="section-title">Our Sacred Collection</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="img-box"><img src="chandan psd pouchPNG.png" alt="Chandan" onerror="this.src='https://via.placeholder.com/200?text=Chandan'"></div>
                <h3>Chandan Fragrance</h3>
                <span class="price">₹20.00</span>
                <a href="https://wa.me/919354646811" class="order-btn"><i class="fab fa-whatsapp"></i> Buy on WhatsApp</a>
            </div>
            <div class="product-card">
                <div class="img-box"><img src="gugal pouch.png" alt="Gugal" onerror="this.src='https://via.placeholder.com/200?text=Gugal'"></div>
                <h3>Gugal Zipper</h3>
                <span class="price">₹20.00</span>
                <a href="https://wa.me/919354646811" class="order-btn"><i class="fab fa-whatsapp"></i> Buy on WhatsApp</a>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="contact" style="background: var(--dark); color: #666; padding: 40px 20px; text-align: center;">
        <p>&copy; 2026 Shri Hari Mandir. All Rights Reserved.</p>
    </footer>

    <script>
        // Preloader Finalization Logic
        document.addEventListener('DOMContentLoaded', () => {
            // Give assets a moment to settle
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 2500); // 2.5 seconds total loading time
        });

        // Mobile Menu Logic
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuLinks = document.querySelectorAll('.mobile-overlay a');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('open');
            mobileMenu.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : 'auto';
        });

        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('open');
                mobileMenu.classList.remove('active');
                document.body.style.overflow = 'auto';
            });
        });

        // Header Scroll
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 100) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
